[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-analyzer"
version = "1.0.0"
description = "Entropy-based password strength analyzer and secure password generator."
authors = [
    {name = "Mugdho (All Asmaul Husnain)"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
password-analyzer = "main:main"

[tool.setuptools]
py-modules = ["main"]
packages = ["src"]
